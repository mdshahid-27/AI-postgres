[project]
name = "ai-postgres"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed Shahid S", email = "shahidsmohammed47@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.19.0",
    "langchain>=1.3.16",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "sqlmodel>=0.0.39",
    "streamlit>=1.62.0",
]

[project.scripts]
ai-postgres = "ai_postgres:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
